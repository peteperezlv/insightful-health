name: Deploy to EC2 Ubuntu

# Controls when the action will run.
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches:
      - main

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "SFTP"
  deploy:
    name: Build and Deploy to EC2 Ubuntu
    runs-on: ubuntu-latest

    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build
        env:
          #PUBLIC_SITE_URL: ${{ secrets.PUBLIC_SITE_URL }}
          #PUBLIC_POCKETBASE_URL: ${{ secrets.PUBLIC_POCKETBASE_URL }}
          PUBLIC_POCKETBASE_URL: http://127.0.0.1:8090/_/api
          PUBLIC_SITE_URL: https://insightfulhealth.online

          PUBLIC_SITE_DESCRIPTION: Public health data analytics and insights

          # OAuth Credentials - Google (development)
          PRIVATE_OAUTH_GOOGLE_CLIENT_ID: ${{ secrets.PRIVATE_OAUTH_GOOGLE_CLIENT_ID }}
          PRIVATE_OAUTH_GOOGLE_CLIENT_SECRET: ${{ secrets.PRIVATE_OAUTH_GOOGLE_CLIENT_SECRET }}
          PRIVATE_OAUTH_GOOGLE_REDIRECT_URI: ${{ secrets.PRIVATE_OAUTH_GOOGLE_REDIRECT_URI }}

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: |
          set -x mkdir -p ~/.ssh 
          chmod 700 ~/.ssh 
          ssh-keyscan -4 -H ${{ secrets.SSH_HOST }}  2>&1 | tee -a ~/.ssh/known_hosts

      - name: Deploy to EC2 Ubuntu
        run: |
          set -x
          # Create deployment archive
          tar -czf deploy.tar.gz dist/ package.json package-lock.json

          # Upload to server
          scp -o StrictHostKeyChecking=no -o ConnectTimeout=10 \
            deploy.tar.gz ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:/tmp/

          # Execute deployment commands
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 \
             ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} << 'ENDSSH'
               set -e
           
               mkdir -p ~/backups
           
               cd /var/www/insightful-health
           
               # Backup current version
               if [ -d "dist" ]; then
                 tar -czf ~/backups/site_backup_$(date +%Y%m%d_%H%M%S).tar.gz dist/
               fi
           
               # Extract new version safely
               tar -xzf /tmp/deploy.tar.gz -C /var/www/insightful-health
               rm /tmp/deploy.tar.gz
           
               # Install dependencies only if package.json changed
               if ! cmp -s package.json /var/www/insightful-health/package.json; then
                 npm ci # pp 1/18/2026 --production removed to resolve deployment error
               fi
           
               # Restart PM2 safely
               if pm2 describe insightful-health > /dev/null 2>&1; then
                 pm2 restart insightful-health
               else
                 pm2 start dist/server.js --name insightful-health
               fi
           
               # Reload Nginx
               sudo systemctl reload nginx
           
               # Clean old backups (keep last 5)
               cd ~/backups
               ls -t site_backup_*.tar.gz | tail -n +6 | xargs -r rm
           
               echo "Deployment successful!"
          ENDSSH

      - name: Verify deployment
        run: |
          sleep 5
          response=$(curl -s -o /dev/null -w "%{http_code}" https://insightfulhealth.online)

          if [ "$response" -ge 200 ] && [ "$response" -lt 400 ]; then
            echo "Site is accessible (HTTP $response)"
          else
            echo "Site returned this HTTP $response"
            exit 1
          fi
